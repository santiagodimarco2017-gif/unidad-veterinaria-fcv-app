name: Compilar APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk DosisVet-FCV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DosisVet-FCV-apk
          path: DosisVet-FCV.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dosis Vet FCV v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK de la calculadora de dosis (perros y gatos).
            Descargá **DosisVet-FCV.apk** desde el celular e instalalo (permitir "instalar apps de origen desconocido").
          files: DosisVet-FCV.apk
          make_latest: true
